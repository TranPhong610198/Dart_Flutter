spring:
  application:
    name: myfschool

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  data:
    web:
      pageable:
        one-indexed-parameters: true
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        enable_lazy_load_no_trans: true
        format_sql: true
        jdbc:
          batch_size: 1000
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  profiles:
    active: uat

  messages:
    basename: i18n/messages
    encoding: UTF-8

server:
  port: 8080